# ──────────────────────────────────────────────
# Nombre del microservicio (así aparece en Eureka)
# ──────────────────────────────────────────────
spring.application.name=CURSOS

# ──────────────────────────────────────────────
# Puerto del servidor
# ──────────────────────────────────────────────
server.port=8081

# ──────────────────────────────────────────────
# Base de datos H2 en memoria (para desarrollo)
# ──────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:cursosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 (accesible en http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ──────────────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ──────────────────────────────────────────────
# Eureka Client — apunta al Eureka Server
# ──────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Metadatos de la instancia (hostname + IP)
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# ──────────────────────────────────────────────
# Actuator — expone endpoints de salud
# ──────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always